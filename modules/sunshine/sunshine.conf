# Sunshine 設定（生ファイル / home-manager で ~/.config/sunshine/sunshine.conf に symlink）
# 用途: hikuo-desktop の HDMI-A-1 (4K) を iPhone から Moonlight で「閲覧のみ」
# 音声とマウス・キーボードは有効。ゲームパッドは使わないのでサーバ側で無効化する。

sunshine_name = hikuo-desktop

# キャプチャ対象モニタ。Sunshine 2026.516 以降 wlr は xdg_output のコネクタ名で指定する
# （旧版の数値インデックス指定は実配信パスで一致せず Monitor 0 にフォールバックする）
#   DP-1     (Dell S2722DC, 2560x1440)
#   HDMI-A-1 (Dell S2722QC, 3840x2160)  ← これを使う
output_name = HDMI-A-1

# Web UI の言語
locale = ja

# wlroots 系 (niri) の Wayland screencopy でキャプチャ
capture = wlr

# NVENC (GPU エンコード)。package を cudaSupport=true でビルドして有効化している。
encoder = nvenc

# 音声も配信する（Sunshine が専用仮想シンク sink-sunshine-stereo を作りキャプチャ）
stream_audio = enabled

# 入力: マウス・キーボードを有効。HDMI-A-1 は scale 2(整数倍)なので、過去にあった
# フラクショナルスケーリング(scale 1.5)起因のカーソル座標ずれは起きにくい。
# ゲームパッドは使わないので無効。
mouse = enabled
keyboard = enabled
controller = disabled
